iframe{width:100%;height:220px;border:1px solid var(--bd);border-radius:8px}
a.b{display:block;text-align:center;padding:7px;border-radius:6px;background:var(--ac);color:#fff;text-decoration:none}
a.b.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:12px}table{font-size:12px;width:100%}td:first-child{color:var(--mu);width:90px}
@media(max-width:900px){body{height:auto}main{grid-template-columns:1fr}#map{height:60vh}.l,.r{border:0}}

 osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}),
 topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap, © OpenStreetMap'});
(location.protocol==='file:'?jalan:osm).addTo(map);
L.control.layers({'Jalan (Esri)':jalan,'Satelit':esri,'OpenStreetMap standar':osm,'Topografi':topo}).addTo(map);
const kabs=[...new Set(D.map(r=>r[0]))].sort(),col=k=>`hsl(${kabs.indexOf(k)*360/kabs.length},70%,45%)`;
const layer=L.layerGroup().addTo(map),hl=L.layerGroup().addTo(map);let F=[],cur=null,sat=0;
kabs.forEach(k=>$('kab').add(new Option(k,k)));
function fillKec(){const k=$('kab').value,s=[...new Set(D.filter(r=>!k||r[0]==k).map(r=>r[1]))].sort();
 $('kec').length=1;s.forEach(x=>$('kec').add(new Option(x,x)));}
function fillDes(){const k=$('kab').value,c=$('kec').value,v=D.filter(r=>(!k||r[0]==k)&&(!c||r[1]==c)).sort((a,b)=>a[2].localeCompare(b[2]));
 $('des').length=1;v.forEach(r=>$('des').add(new Option(r[2]+(c?'':' ('+r[1]+(k?'':', '+r[0])+')'),r[7])));$('des').options[0].text='Semua ('+v.length+')';}
function apply(fit=true){const k=$('kab').value,c=$('kec').value,s=$('st').value,d=$('des').value,q=$('q').value.trim().toLowerCase();
 F=D.filter(r=>(!k||r[0]==k)&&(!c||r[1]==c)&&(!d||r[7]==d)&&(s===''||r[6]==s)&&(!q||(r[2]+' '+r[1]).toLowerCase().includes(q)));
 layer.clearLayers();
 F.forEach(r=>{const m=L.circleMarker([r[3],r[4]],{radius:4,color:'#fff',weight:.6,fillColor:col(r[0]),fillOpacity:.9});
  m.on('click',()=>pick(r));m.bindTooltip(r[2]+' · '+r[1]);layer.addLayer(m);});
 if(fit&&F.length)map.fitBounds(L.latLngBounds(F.map(r=>[r[3],r[4]])),{padding:[30,30],maxZoom:14});
 stats();labels();
 const ls=q?F.slice(0,8):($('kec').value&&!d?F:[]);
 $('res').innerHTML=(!q&&ls.length?`<div class="mu">${ls.length} kelurahan/desa di Kec. ${esc($('kec').value)}:</div>`:'')+ls.map((r,i)=>`<div data-i="${i}">${esc(r[2])} <span class="mu">· ${esc(r[1])}, ${esc(r[0])}</span></div>`).join('')||(q?'<div class="mu">Tidak ditemukan</div>':'');
 $('res').querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{const r=F[e.dataset.i];pick(r);map.flyTo([r[3],r[4]],15)});}
function stats(){$('k1').textContent=F.length.toLocaleString('id');$('k2').textContent=new Set(F.map(r=>r[0])).size;
 $('k3').textContent=new Set(F.map(r=>r[0]+r[1])).size;$('k4').textContent=F.filter(r=>!r[6]).length.toLocaleString('id');$('k5').textContent=F.filter(r=>r[6]).length.toLocaleString('id');
 const byKec=!!$('kab').value,g={};F.forEach(r=>{const x=r[byKec?1:0];g[x]=(g[x]||0)+1});
 const t=Object.entries(g).sort((a,b)=>b[1]-a[1]),mx=t.length?t[0][1]:1;
 $('bt').textContent=byKec?'Jumlah titik per Kecamatan ('+t.length+')':'Jumlah titik per Kab/Kota ('+t.length+')';
 $('bars').innerHTML=t.map(([n,v])=>`<div class="bar" data-n="${esc(n)}" title="Klik untuk memfilter"><span>${esc(n)}</span><i style="width:${v/mx*100}%"></i><span>${v}</span></div>`).join('');
 $('bars').querySelectorAll('.bar').forEach(e=>e.onclick=()=>{const n=e.dataset.n;if(byKec){$('kec').value=n;fillDes()}else{$('kab').value=n;fillKec();fillDes()}apply()});}
const gm=(r,t)=>`https://maps.google.com/maps?q=${r[3]},${r[4]}&z=16&t=${t?'k':'m'}&output=embed`;
let prov=1;const osmE=r=>`https://www.openstreetmap.org/export/embed.html?bbox=${r[4]-.004}%2C${r[3]-.003}%2C${r[4]+.004}%2C${r[3]+.003}&layer=mapnik&marker=${r[3]}%2C${r[4]}`,emb=r=>prov?osmE(r):gm(r,sat);
function pick(r){cur=r;hl.clearLayers();L.circleMarker([r[3],r[4]],{radius:10,color:'#e5484d',weight:3,fillOpacity:0}).addTo(hl);
 const ll=r[3]+','+r[4];
 $('det').className='';$('det').innerHTML=`<div style="display:grid;gap:8px"><b style="font-size:15px">${esc(r[2])}</b>
 <table><tr><td>Status</td><td>${r[6]?'Kelurahan':'Desa'}</td></tr><tr><td>Kecamatan</td><td>${esc(r[1])}</td></tr><tr><td>Kab/Kota</td><td>${esc(r[0])}</td></tr>
 <tr><td>Kode pos</td><td>${esc(r[5]||'-')}</td></tr><tr><td>Kode wilayah</td><td>${esc(r[7])}</td></tr><tr><td>Koordinat</td><td>${ll}</td></tr></table>
 <div style="display:flex;gap:6px"><button class="s" id="po">OpenStreetMap</button><button class="s" id="pg">Google Maps</button></div>
 <iframe id="gf" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${emb(r)}"></iframe>
 <button class="s" id="tg">Google: ganti Peta / Satelit</button>
 <a class="b" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${ll}">Buka di Google Maps</a>
 <a class="b s" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${ll}">Rute ke lokasi</a>
 <a class="b s" target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}">Street View</a>
 <a class="b s" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${r[3]}&mlon=${r[4]}#map=17/${r[3]}/${r[4]}">Buka di OpenStreetMap</a>
 <button class="s" id="cp">Salin koordinat</button></div>`;
 $('tg').onclick=()=>{sat^=1;prov=0;$('gf').src=emb(cur)};$('pg').onclick=()=>{prov=0;$('gf').src=emb(cur)};$('po').onclick=()=>{prov=1;$('gf').src=emb(cur)};
 $('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(ll);$('cp').textContent='Tersalin ✓'};}
$('kab').onchange=()=>{fillKec();fillDes();apply()};$('kec').onchange=()=>{fillDes();apply()};$('st').onchange=()=>apply();
$('des').onchange=()=>{apply();if($('des').value&&F[0]){pick(F[0]);map.flyTo([F[0][3],F[0][4]],15)}};
let tm;$('q').oninput=()=>{clearTimeout(tm);tm=setTimeout(apply,250)};
$('rs').onclick=()=>{$('q').value='';$('kab').value='';$('st').value='';fillKec();fillDes();apply()};
$('ex').onclick=()=>{const h='kab_kota,kecamatan,kelurahan_desa,latitude,longitude,kode_pos,status,kode\n',
 b=F.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6]?'KELURAHAN':'DESA',r[7]].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+h+b],{type:'text/csv'}));a.download='jawa_barat_filter.csv';a.click()};
const lg=L.layerGroup().addTo(map);
function labels(){lg.clearLayers();if(!$('lbl').checked){$('lbn').textContent='';return}
 const all=($('kec').value||$('des').value)&&F.length<=80;
 if(!all&&map.getZoom()<12){$('lbn').textContent='Perbesar peta (zoom 12 ke atas) untuk melihat nama.';return}
 const b=map.getBounds(),v=all?F:F.filter(r=>b.contains([r[3],r[4]]));
 v.slice(0,400).forEach(r=>L.marker([r[3],r[4]],{interactive:false,icon:L.divIcon({className:'',html:'<span class="lbs">'+esc(r[2])+'</span>',iconSize:[0,0]})}).addTo(lg));
 $('lbn').textContent=v.length>400?'Menampilkan 400 dari '+v.length+' nama, perbesar lagi.':v.length+' nama ditampilkan.';}
map.on('moveend',labels);$('lbl').onchange=labels;
fillKec();fillDes();apply();
</script></body></html>
